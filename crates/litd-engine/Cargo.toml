[package]
name = "litd-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Light in the Dark engine core — rendering, sim, assets (built on Calyx)."
# FSV example binaries are gated behind the `fsv` feature and declared explicitly below, so a
# routine `cargo test` gate never compiles+links them (#1497). autoexamples=false disables
# auto-discovery so a new example that skips the gate is a hard "no such target", not a
# silent addition to every test build.
autoexamples = false

[features]
default = ["full", "wasm-script"]
# Full editor/authoring/analysis surface. The runtime game deliberately leaves this
# disabled so authoring-only Calyx AI/registry code cannot enter its production graph.
full = [
    "dep:calyx-agent",
    "dep:calyx-anneal",
    "dep:calyx-assay",
    "dep:calyx-ledger",
    "dep:calyx-loom",
    "dep:calyx-oracle",
    "dep:calyx-registry",
    "dep:calyx-ward",
]
runtime = []
wasm-script = [
    "dep:wasm-encoder",
    "dep:wasmparser",
    "dep:wasmtime",
    "dep:wat",
]
cuda = ["calyx-forge/cuda"]
# Enables the FSV example binaries (one-shot verification programs). Off by default so
# `cargo test` skips them; run with `cargo run --features fsv --example <name>`.
#
# `fsv` also activates the calyx-agent LLM transport (#1548). That dependency is OPTIONAL on
# purpose: calyx-agent carries an HTTP client, and litd-engine is linked by litd-game and
# litd-editor. Keeping the transport out of the default graph makes "the engine cannot call a
# model from inside a sim tick" a compile-time fact rather than a code-review convention. Only
# the FSV example — which must call the REAL provider — ever links it.
#
# `fsv` also pulls in `naga` (wgpu's shader frontend, already in the tree via wgpu) so the
# CDLOD terrain FSV (#1739) can PARSE + VALIDATE `cdlod_morph.wgsl` headlessly -- a broken
# shader fails the example. naga is optional + fsv-only so the routine engine build never
# links a shader compiler it does not need.
fsv = ["dep:calyx-agent", "dep:naga"]

[dependencies]
bytemuck.workspace = true
bincode.workspace = true
calyx-agent = { path = "../../Calyx/crates/calyx-agent", optional = true }
naga = { version = "27", optional = true }
calyx-anneal = { path = "../../Calyx/crates/calyx-anneal", optional = true }
calyx-assay = { path = "../../Calyx/crates/calyx-assay", optional = true }
calyx-aster = { path = "../../Calyx/crates/calyx-aster" }
calyx-core = { path = "../../Calyx/crates/calyx-core" }
calyx-forge = { path = "../../Calyx/crates/calyx-forge", default-features = false }
calyx-ledger = { path = "../../Calyx/crates/calyx-ledger", optional = true }
calyx-loom = { path = "../../Calyx/crates/calyx-loom", optional = true }
calyx-oracle = { path = "../../Calyx/crates/calyx-oracle", optional = true }
calyx-registry = { path = "../../Calyx/crates/calyx-registry", optional = true }
calyx-ward = { path = "../../Calyx/crates/calyx-ward", optional = true }
fontdue.workspace = true
epaint_default_fonts.workspace = true
glam.workspace = true
gltf.workspace = true
hound.workspace = true
jsonschema.workspace = true
kira.workspace = true
litd-hash.workspace = true
mint.workspace = true
ron.workspace = true
rustybuzz.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
unicode-bidi.workspace = true
unicode-segmentation.workspace = true
pollster.workspace = true
rapier3d.workspace = true
rayon.workspace = true
wgpu.workspace = true
winit.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wasm-encoder = { workspace = true, optional = true }
wasmparser = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }
wat = { workspace = true, optional = true }

