[package]
name = "litd-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Light in the Dark editor — the no-code creation tool, built on litd-engine."
# FSV example binaries are gated behind the `fsv` feature and declared explicitly below, so a
# routine `cargo test` gate never compiles+links them (#1497). autoexamples=false disables
# auto-discovery so a new example that skips the gate is a hard "no such target", not a
# silent addition to every test build.
autoexamples = false

[features]
# Enables the FSV example binaries (one-shot verification programs). Off by default so
# `cargo test` skips them; run with `cargo run --features fsv --example <name>`.
# Forwards to litd-engine/fsv so material-preview FSV examples can naga-validate WGSL (#862).
fsv = ["litd-engine/fsv"]

[[bin]]
name = "litd-editor"
path = "src/main.rs"

[[bin]]
name = "litd-editor-mcp-stdio"
path = "src/bin/litd-editor-mcp-stdio.rs"

[[bin]]
name = "litd-editor-asset-floor-select"
path = "src/bin/litd-editor-asset-floor-select.rs"

[dependencies]
calyx-aster = { path = "../../Calyx/crates/calyx-aster" }
calyx-core = { path = "../../Calyx/crates/calyx-core" }
calyx-loom = { path = "../../Calyx/crates/calyx-loom" }
calyx-mcp = { path = "../../Calyx/crates/calyx-mcp" }
calyx-paths = { path = "../../Calyx/crates/calyx-paths" }
calyx-registry = { path = "../../Calyx/crates/calyx-registry" }
calyx-sextant = { path = "../../Calyx/crates/calyx-sextant" }
litd-editor-mcp = { path = "../litd-editor-mcp", features = ["calyx-live-calls"] }
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
basis-universal.workspace = true
gltf.workspace = true
hound.workspace = true
image.workspace = true
meshopt.workspace = true
ktx2.workspace = true
lewton.workspace = true
litd-hash.workspace = true
litd-engine.workspace = true
pollster.workspace = true
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
tracing.workspace = true
wgpu.workspace = true
winit.workspace = true
zip.workspace = true

