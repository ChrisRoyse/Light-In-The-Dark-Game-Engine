<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Vellum of Ember Roads</title>
  <desc id="desc">Original Ashen Reach parchment map reference for a source-gated RPG map item. It shows named places, roads, rivers, faction marks, danger marginalia, torn grey Reach zones, and no live character marker, grid, quest pin, or route ribbon.</desc>
  <defs>
    <linearGradient id="vellum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ead9ad"/>
      <stop offset="45%" stop-color="#d2b981"/>
      <stop offset="100%" stop-color="#aa7f46"/>
    </linearGradient>
    <radialGradient id="reachGrey" cx="55%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#b8b5a9" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#595851" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#312d2a" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="inkBleed" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="1448"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <style>
      .ink { fill: none; stroke: #3a2514; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; filter: url(#inkBleed); }
      .thin { fill: none; stroke: #4b3019; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .river { fill: none; stroke: #49636b; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; opacity: 0.75; }
      .road { fill: none; stroke: #6e3f1d; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 18 12; }
      .minor-road { fill: none; stroke: #76512d; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 12 9; opacity: 0.9; }
      .label { font-family: Georgia, 'Times New Roman', serif; font-size: 28px; fill: #2e2014; letter-spacing: 0; }
      .small { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; fill: #352315; letter-spacing: 0; }
      .tiny { font-family: Georgia, 'Times New Roman', serif; font-size: 16px; fill: #3d2817; letter-spacing: 0; }
      .warning { font-family: Georgia, 'Times New Roman', serif; font-size: 18px; fill: #5b241c; letter-spacing: 0; font-style: italic; }
      .place { fill: #2f2116; stroke: #120b06; stroke-width: 2; }
      .wash { fill: #6b6a61; opacity: 0.28; }
      .seal { fill: #8b2e21; stroke: #3a1b15; stroke-width: 2; }
      .gold { fill: #b7832e; stroke: #4b2e12; stroke-width: 2; }
      .forest { fill: #415338; stroke: #26321d; stroke-width: 1.5; opacity: 0.95; }
      .mount { fill: #5b5148; stroke: #30261e; stroke-width: 2; }
    </style>
  </defs>

